name: Build Unsigned IPA

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          ls -1 /Applications | grep -i xcode || true
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Build .app (unsigned)
        working-directory: BlankApp
        run: |
          set -euo pipefail
          xcodebuild build \
            -project BlankApp.xcodeproj \
            -scheme BlankApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PRODUCT_BUNDLE_IDENTIFIER=com.blank.app

      - name: Package .ipa
        working-directory: BlankApp
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -type d -name 'BlankApp.app' -print -quit)"
          echo "App path: ${APP_PATH}"
          test -n "${APP_PATH}"
          rm -rf Payload BlankApp.ipa
          mkdir Payload
          cp -R "${APP_PATH}" Payload/
          zip -qry BlankApp.ipa Payload
          unzip -tq BlankApp.ipa
          ls -lh BlankApp.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlankApp-unsigned-ipa
          path: BlankApp/BlankApp.ipa
          if-no-files-found: error
          retention-days: 30
